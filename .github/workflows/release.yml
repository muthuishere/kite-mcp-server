name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Setup Nix environment
      run: nix develop --command echo "Nix environment ready"

    - name: Run tests
      run: nix develop --command just test

    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build binaries
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        LDFLAGS="-s -w -X main.MCP_SERVER_VERSION=${VERSION}"
        nix develop --command bash -c "GOOS=linux  GOARCH=amd64 CGO_ENABLED=0 go build -o zkite -ldflags='${LDFLAGS}' main.go && tar czf zkite-linux-amd64.tar.gz zkite && rm zkite"
        nix develop --command bash -c "GOOS=linux  GOARCH=arm64 CGO_ENABLED=0 go build -o zkite -ldflags='${LDFLAGS}' main.go && tar czf zkite-linux-arm64.tar.gz zkite && rm zkite"
        nix develop --command bash -c "GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o zkite -ldflags='${LDFLAGS}' main.go && tar czf zkite-darwin-amd64.tar.gz zkite && rm zkite"
        nix develop --command bash -c "GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o zkite -ldflags='${LDFLAGS}' main.go && tar czf zkite-darwin-arm64.tar.gz zkite && rm zkite"
        nix develop --command bash -c "GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o zkite.exe -ldflags='${LDFLAGS}' main.go && zip zkite-windows-amd64.zip zkite.exe && rm zkite.exe"

    - name: Generate checksums
      run: sha256sum zkite-*.tar.gz zkite-*.zip > checksums.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          zkite-linux-amd64.tar.gz
          zkite-linux-arm64.tar.gz
          zkite-darwin-amd64.tar.gz
          zkite-darwin-arm64.tar.gz
          zkite-windows-amd64.zip
          checksums.txt
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
